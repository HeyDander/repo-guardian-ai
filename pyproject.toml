[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-guardian-ai"
version = "0.3.2"
description = "Evidence-based repository health audits for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Repo Guardian contributors"}]
dependencies = []

[project.scripts]
repo-guardian = "repo_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
